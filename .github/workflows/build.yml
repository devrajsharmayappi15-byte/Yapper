name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: mkdir -p www && cp index.html config.js www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Add app icons
        run: |
          R=android/app/src/main/res
          for e in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n s f <<< "$e"
            convert icon-only.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            convert icon-only.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher_round.png
            convert icon-foreground.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk YAPPER.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YAPPER build ${{ github.run_number }}
          files: YAPPER.apk
