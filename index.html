#scr label{margin:7px 0 3px}
.av.ph{background-size:cover;background-position:center;background-repeat:no-repeat;color:transparent}
.av.sm{width:28px;height:28px;margin:0;font-size:13px;border-width:1.5px;flex:none}
.av.big.ph,.card.c .av.big{border-color:rgba(245,184,46,.7)}
.phb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.phb button{display:flex;align-items:center;gap:7px;padding:9px 14px;font-size:13px;border-radius:99px}
.phb button svg{color:#FFC24A}

/* v3.3: compact popups, matching buttons */
#pop{padding:16px}
#pop .pc2{max-width:288px;padding:18px 16px 14px;border-radius:20px}
#pop .pi{font-size:30px;margin-bottom:4px}
#pop .pc2 h2{font-size:16px;margin:0 0 6px}
#pop .pc2 p{font-size:12.5px;line-height:1.45}
#pop .pb{gap:8px;margin-top:14px}
#pop .pb button,#pop .pb button.p{flex:1;height:40px;padding:0 10px;font-size:13.5px;font-weight:700;border-radius:12px;border:1px solid rgba(255,255,255,.22);box-shadow:none;display:flex;align-items:center;justify-content:center}
#pop .pb button{background:rgba(255,255,255,.09);color:#fff}
#pop .pb button.p{background:linear-gradient(180deg,#FFD25A,#F2A41B);border-color:#FFD25A;color:#1b1305}
#modal{padding:12px}
#modal .mc{max-width:300px;padding:14px;border-radius:20px}
#modal .mc h2{font-size:16px}
#modal .mc button.chip{padding:10px 12px;margin-top:8px}
#modal .mc button.chip b{font-size:14px}

/* v3.4: transaction cards, hidden modal scrollbar */
.txl{display:flex;flex-direction:column;gap:10px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 45%,rgba(9,11,17,.74));border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 22px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.txi{flex:none;display:flex;align-items:center;align-self:stretch;padding-right:12px;border-right:1px solid rgba(255,255,255,.16)}
.txm{flex:1;min-width:0}
.txt{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.txd{font-size:12px;color:#aab0bb;margin-top:2px;overflow-wrap:anywhere}
.txa{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.txa b{font-size:17px;font-variant-numeric:tabular-nums}
.tx.out .txa b{color:#ff5a5a}.tx.in .txa b{color:#3fe27d}
.txa b.bad{text-decoration:line-through;opacity:.6}
#modal,#modal .mc,#pop,#scr{scrollbar-width:none;-ms-overflow-style:none}
#modal::-webkit-scrollbar,#modal .mc::-webkit-scrollbar,#pop::-webkit-scrollbar{display:none;width:0;height:0}

/* v3.5: photo adjuster */
#crop{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:14px}
#crop .cc{width:100%;max-width:310px;background:linear-gradient(145deg,#22252B,#111318);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:14px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55)}
#crop h2{font-size:16px;margin:0 0 10px}
#crop .cv{position:relative;width:260px;max-width:100%;aspect-ratio:1;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;touch-action:none}
#crop canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#crop .cm{position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:0 0 0 400px rgba(0,0,0,.58);border:2px solid #F5B82E}
#crop .cht{margin-top:8px;font-size:12px}
#crop .crz{display:flex;align-items:center;gap:10px;margin-top:10px}
#crop .crz button{display:flex;padding:8px 10px;border-radius:12px;color:#FFC24A}
#crop .crz input{flex:1;height:24px;padding:0;border:0;background:none;box-shadow:none;accent-color:#F5B82E}
#crop .pb{display:flex;gap:8px;margin-top:12px}
#crop .pb button,#crop .pb button.p{flex:1;height:40px;padding:0 10px;font-size:13.5px;font-weight:700;border-radius:12px;border:1px solid rgba(255,255,255,.22);box-shadow:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.09);color:#fff}
#crop .pb button.p{background:linear-gradient(180deg,#FFD25A,#F2A41B);border-color:#FFD25A;color:#1b1305}

/* v3.6: theme toggle, dark = black and gold, light = white and gold */
.hdr{display:flex;align-items:center;gap:8px}
.tgl{display:flex;padding:3px;border-radius:99px;background:rgba(12,14,20,.7);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tgl button{display:flex;align-items:center;justify-content:center;width:32px;height:28px;padding:0;border:0;border-radius:99px;background:none;color:#aab0bb}
.tgl button.on{background:linear-gradient(180deg,#FFD25A,#F2A41B);color:#1b1305;box-shadow:0 3px 10px rgba(245,164,27,.4)}
html[data-mode="light"]{--tx:#1a1a1f;--mu:#6b6f7a;--ac:#C98A0B;--ok:#1f9d55;--bad:#d93636;--bd:rgba(20,20,30,.12);color-scheme:light}

html[data-mode="light"] .sl svg{color:#C98A0B}
html[data-mode="light"] .sbr{background:rgba(20,20,30,.1)}
html[data-mode="light"] .tc:not(.glow) .tc-b{background:rgba(20,20,30,.05);color:#1a1a1f;border-color:rgba(20,20,30,.14)}

html[data-mode="light"] .tgl{background:#fff;border-color:rgba(20,20,30,.14)}

html[data-mode="light"] #nav{background:rgba(255,255,255,.94);border-color:rgba(20,20,30,.08);box-shadow:0 8px 26px rgba(30,25,10,.14),inset 0 1px 0 #fff}

html[data-mode="light"] .stats div{background:rgba(20,20,30,.04);border-color:rgba(20,20,30,.06)}

html[data-mode="light"] .txd{color:#6b6f7a}

/* v3.8: motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.88) translateY(8px)}to{opacity:1;transform:none}}
@keyframes iconpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes crown{0%{opacity:0;transform:translateY(-18px) scale(.5) rotate(-12deg)}60%{transform:translateY(0) scale(1.2) rotate(4deg)}100%{opacity:1;transform:none}}
@keyframes shine{from{background-position:120% 0}to{background-position:-20% 0}}
@keyframes livep{0%,100%{box-shadow:0 0 0 0 rgba(240,60,60,.55)}70%{box-shadow:0 0 0 8px rgba(240,60,60,0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes glowo{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
@keyframes fillw{from{width:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes tick{from{opacity:.55;transform:scale(1.05)}to{opacity:1;transform:none}}
@keyframes podrise{from{opacity:0;transform:translateY(34px) scale(.9)}to{opacity:1;transform:none}}
@keyframes avglow{0%,100%{box-shadow:0 0 0 4px rgba(245,184,46,.1)}50%{box-shadow:0 0 0 7px rgba(245,184,46,.28),0 0 22px rgba(245,184,46,.5)}}
@keyframes avglow2{0%,100%{box-shadow:0 0 0 0 rgba(245,184,46,0)}50%{box-shadow:0 0 0 5px rgba(245,184,46,.18),0 0 18px rgba(245,184,46,.35)}}
@keyframes navpop{0%{transform:scale(.7)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes txin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flashg{0%{box-shadow:0 0 0 2px rgba(63,226,125,.85),0 0 26px rgba(63,226,125,.5)}100%{box-shadow:0 8px 22px rgba(0,0,0,.3)}}
@keyframes flashr{0%{box-shadow:0 0 0 2px rgba(255,90,90,.85),0 0 26px rgba(255,90,90,.5)}100%{box-shadow:0 8px 22px rgba(0,0,0,.3)}}
@keyframes chipf{0%{box-shadow:0 0 0 0 rgba(245,184,46,.7);transform:scale(.98)}60%{box-shadow:0 0 0 10px rgba(245,184,46,0);transform:scale(1.02)}100%{transform:none}}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@keyframes ember{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.85}85%{opacity:.45}100%{transform:translate3d(var(--x),-100dvh,0);opacity:0}}
@keyframes swapbg{from{opacity:.15}to{opacity:1}}
/* splash */
#splash{transition:opacity .5s,transform .6s}
#splash.hide{transform:scale(1.05)}
#splash .cr{animation:crown 1.1s cubic-bezier(.2,1.4,.4,1) both}
#splash h3{animation:rise .8s .4s both}
#splash .mu{animation:rise .8s .55s both}
#splash h1.logo{background:linear-gradient(100deg,#FFD27A 35%,#fff 50%,#FFD27A 65%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;animation:rise .8s .2s both,shine 1.8s .5s ease-in-out both}
html[data-mode="light"] #splash h1.logo{background-image:linear-gradient(100deg,#B87800 35%,#FFD25A 50%,#B87800 65%)}
/* screens rise in on navigation only */
#scr .card{animation:none}
#scr.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#scr.anim>*:nth-child(2){animation-delay:0.06s}
#scr.anim>*:nth-child(3){animation-delay:0.12s}
#scr.anim>*:nth-child(4){animation-delay:0.18s}
#scr.anim>*:nth-child(5){animation-delay:0.24s}
#scr.anim>*:nth-child(6){animation-delay:0.30s}
#scr.anim>*:nth-child(7){animation-delay:0.36s}
#scr.anim>*:nth-child(8){animation-delay:0.42s}
#scr.anim>*:nth-child(9){animation-delay:0.48s}
#scr.anim>*:nth-child(10){animation-delay:0.48s}
#scr.anim>.txl{animation:none}
#scr.anim .txl>.tx{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#scr.anim .txl>.tx:nth-child(1){animation-delay:0.15s}
#scr.anim .txl>.tx:nth-child(2){animation-delay:0.20s}
#scr.anim .txl>.tx:nth-child(3){animation-delay:0.25s}
#scr.anim .txl>.tx:nth-child(4){animation-delay:0.30s}
#scr.anim .txl>.tx:nth-child(5){animation-delay:0.35s}
#scr.anim .txl>.tx:nth-child(6){animation-delay:0.40s}
#scr.anim .txl>.tx:nth-child(7){animation-delay:0.45s}
#scr.anim .txl>.tx:nth-child(8){animation-delay:0.50s}
#scr.anim .txl>.tx:nth-child(9){animation-delay:0.55s}
#scr.anim .sbr i{animation:fillw .9s .15s cubic-bezier(.2,.8,.2,1) both}
#scr.anim .sbr.full{animation:shake .5s .9s both}
#scr.anim .pod .pc{animation:podrise .75s cubic-bezier(.2,.9,.3,1.1) both}
#scr.anim .pod .pc:nth-child(1){animation-delay:.2s}
#scr.anim .pod .pc:nth-child(3){animation-delay:.35s}
#scr.anim .pod .pc:nth-child(2){animation-delay:.55s}
/* live and featured */
.badge.live{animation:livep 1.7s infinite}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px;animation:blink 1.1s infinite}
.card.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(245,184,46,.9),inset 0 0 24px rgba(245,184,46,.28);opacity:.15;animation:glowo 2.8s ease-in-out infinite}
.card.glow .tc-b{position:relative;overflow:hidden}
.card.glow .tc-b::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite;pointer-events:none}
.pc.f .av{animation:avglow 2.6s ease-in-out infinite}
.card.c .av.big{animation:avglow2 3s ease-in-out infinite}
.cd #cd.tk{animation:tick .35s ease-out}
.cd #cd.hot{color:#ff6a6a!important}
/* nav indicator */
#nav .ind{position:absolute;left:0;bottom:4px;width:24px;height:3px;border-radius:3px;background:#F5B82E;box-shadow:0 0 8px #F5B82E;transition:transform .38s cubic-bezier(.3,1.25,.4,1);pointer-events:none}
#nav button.on::after{display:none}
#nav button.on i{animation:navpop .5s cubic-bezier(.2,1.6,.4,1)}
/* transactions */
.tx.nw.in{animation:txin .55s cubic-bezier(.2,.9,.3,1.1) both,flashg 1.4s ease-out}
.tx.nw.out{animation:txin .55s cubic-bezier(.2,.9,.3,1.1) both,flashr 1.4s ease-out}
/* popups */
#pop,#modal,#crop{animation:fadein .2s both}
#pop .pc2{animation:popin .34s cubic-bezier(.2,.9,.3,1.25) both}
#modal .mc,#crop .cc{animation:popin .32s cubic-bezier(.2,.9,.3,1.2) both}
#pop .pi{position:relative;animation:iconpop .55s .12s cubic-bezier(.2,1.7,.4,1) both}
.sp{position:absolute;left:50%;top:50%;margin:-3px;border-radius:50%;background:#FFC24A;box-shadow:0 0 8px #F5B82E;animation:spark .85s ease-out both;pointer-events:none}
.chip.flash{animation:chipf .7s ease-out}
/* ambient embers */
#amb{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
html[data-mode="light"] #amb{opacity:.6}
#amb i{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#FFE29A,#F5A21B 60%,transparent 72%);opacity:0;animation:ember var(--d) linear var(--dl) infinite}
/* theme switch */
html.thx body,html.thx #phone *,html.thx #phone *::before{transition:background-color .45s,color .45s,border-color .45s,box-shadow .45s,fill .45s!important}
#phone.swap::before{animation:swapbg .6s ease}
/* motion off */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#amb{display:none}}
html[data-anim="off"] *,html[data-anim="off"] *::before,html[data-anim="off"] *::after{animation:none!important;transition:none!important}
html[data-anim="off"] #amb{display:none}
</style>

let CR=null;
function crDims(){const r=CR.rot%2,w=r?CR.im.height:CR.im.width,h=r?CR.im.width:CR.im.height;return{w,h,b:CR.V/Math.min(w,h)}}
function crClamp(){const d=crDims(),k=d.b*CR.z,mx=Math.max(0,(d.w*k-CR.V)/2),my=Math.max(0,(d.h*k-CR.V)/2);CR.x=Math.max(-mx,Math.min(mx,CR.x));CR.y=Math.max(-my,Math.min(my,CR.y))}
function crPaint(c,size){const x=c.getContext("2d"),k=size/CR.V,d=crDims();x.fillStyle="#000";x.fillRect(0,0,size,size);x.save();x.translate(size/2+CR.x*k,size/2+CR.y*k);x.rotate(CR.rot*Math.PI/2);const q=d.b*CR.z*k;x.scale(q,q);x.drawImage(CR.im,-CR.im.width/2,-CR.im.height/2);x.restore()}

function crSetZ(z){CR.z=Math.max(1,Math.min(4,z));$("#cr_z").value=CR.z;crDraw()}
function crPD(){const a=[...CR.ptr.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0}

  $("#phone").appendChild(m);const cv=$("#cr_c");

  $("#cr_ok").onclick=()=>{try{const c=document.createElement("canvas");c.width=c.height=320;crPaint(c,320);tmpPhoto=c.toDataURL("image/jpeg",.85);showPrev();crClose()}catch(e){alert("Could not use that photo. Try another one.")}};
  crDraw()}
function profV(){const id=viewU||uid,p=S.prof[id],own=id===uid;
  if(own&&(!p||editP))return profForm(p);
  if(!p)return '<p class="mu">Profile not found.</p>';
  const s=statsFor(p);
  return `${viewU?`<p><button onclick="go('board')">← Back</button></p>`:""}<div class="top"><h2 style="margin:0">Profile</h2>${own?`<button onclick="go('settings')">⚙</button>`:""}</div>
  <div class="card c">${avH(p,"big")}<h2>${esc(p.ign)}</h2><div class="mu">BGMI ID: ${esc(p.bgmiId||"-")}${p.team?" · Team: "+esc(p.team):""}</div>
  <div class="stats"><div><b data-cn="${s.played}">${s.played}</b><span>Matches</span></div><div><b data-cn="${s.wins}">${s.wins}</b><span>Wins</span></div><div><b>${s.rate}%</b><span>Win rate</span></div><div><b data-cn="${s.pts}">${s.pts}</b><span>Points</span></div><div><b data-cn="${s.kills}">${s.kills}</b><span>Kills</span></div></div></div>
  ${own?`<div class="card"><div class="mi" onclick="editP=true;render(true)">Edit profile <span>›</span></div><div class="mi" onclick="go('settings')">Settings <span>›</span></div></div>`:""}`}
function settingsV(){return `<p><button onclick="go('profile')">← Back</button></p><h2>Settings</h2><div class="card">
  <div class="mi" onclick="tab='profile';editP=true;render(true)">Account / profile <span>›</span></div>
  <div class="mi" onclick="PREF.vib=!vibOn();savePref();render(true)">Sound &amp; vibration on copy <button class="tg ${vibOn()?"on":""}"></button></div>
  <div class="mi" onclick="PREF.anim=PREF.anim===false;savePref();applyAnim();render(true)">Animations <button class="tg ${PREF.anim!==false?"on":""}"></button></div>
  <div class="mi">Language <span class="mu">English</span></div>
  
  ${isAdmin?`<div class="mi" onclick="asPlayer=!asPlayer;render(true)">Preview as player <button class="tg ${asPlayer?"on":""}"></button></div>`:""}</div>
  <div class="card"><h2>About</h2><p class="mu" style="margin:0">YAPPER is a BGMI tournament hub. Hosts publish room details only for approved players, and results feed the leaderboard.</p></div>`}
const wIc=(c,pl)=>`<svg viewBox="0 0 48 48" width="38" height="38" aria-hidden="true"><rect x="9" y="11" width="22" height="9" rx="3" fill="${c}" opacity=".7"/><rect x="5" y="16" width="34" height="23" rx="6" fill="${c}"/><rect x="5" y="22" width="34" height="3" fill="#0b0d12" opacity=".22"/><circle cx="37" cy="36" r="10" fill="#0b0d12"/><circle cx="37" cy="36" r="8" fill="${c}"/><path d="M33 36h8${pl?"M37 32v8":""}" stroke="#0b0d12" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>`;
function txRow(x,nm){const out=x.kind==="out",bad=x.status==="rejected",pend=x.status==="pending";
  const d=new Date(x.at).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
  return `<div class="tx ${out?"out":"in"}" data-k="${x.at}-${x.kind}-${x.amt}"><div class="txi">${out?wIc("#ff5a5a",false):wIc("#3fe27d",true)}</div><div class="txm"><div class="txt">${esc(x.label)}${nm&&x.name?" · "+esc(x.name):""}</div><div class="txd">${d}</div>${x.sub?`<div class="txd">${out?"":"UPI - "}${esc(x.sub)}</div>`:""}</div><div class="txa"><b class="${bad?"bad":""}">${out?"-":"+"}${money(x.amt)}</b>${pend?'<span class="badge">Pending</span>':bad?'<span class="badge">Rejected</span>':""}</div></div>`}
function walletV(){
  if(adm())return adminWallet();
  const me=txns(uid);
  return `<h2>Wallet</h2><div class="card hero"><div class="mu">Available balance</div><div class="prize" style="font-size:36px;margin-bottom:10px" data-cnt="${bal(uid)}">${money(bal(uid))}</div>`+
  (addOpen?`<label>How much do you want to add? (₹)</label><input id="w_amt" type="number" inputmode="numeric" min="10" placeholder="Enter amount"><div class="chips" style="margin-top:8px">${[50,100,200,500].map(a=>`<button onclick="$('#w_amt').value=${a}">₹${a}</button>`).join("")}</div><p style="margin:0"><button class="p" onclick="nextAdd()">Next →</button> <button onclick="addOpen=false;render(true)">Cancel</button></p>`:`<button class="p" onclick="addOpen=true;render(true)">+ Add Money</button>`)+
  `</div><h2>Transactions</h2><div class="txl">`+(me.length?me.map(x=>txRow(x)).join(""):'<p class="mu" style="margin:0">No transactions yet.</p>')+`</div>`}
function adminWallet(){const cf=S.cfg.payment||{};
  const pend=S.top.filter(x=>!S.rev[x.id]).sort((a,b)=>b.at-a.at);
  const added=Object.values(S.rev).filter(r=>r.status==="approved").reduce((q,r)=>q+(+r.amount||0),0),fees=S.join.reduce((q,j)=>q+(+j.fee||0),0);
  let h=`<div class="top"><h2 style="margin:0">Wallet (Admin)</h2>${roleBtn()}</div>
  <div class="card"><h2>Payment setup</h2><p class="mu" style="margin:0">Players pay to this UPI ID, so the money comes straight to your account.</p><label>Your UPI ID</label><input id="u_id" placeholder="name@bank" value="${esc(cf.upi)}"><label>Payee name</label><input id="u_nm" placeholder="Your name" value="${esc(cf.name)}"><p><button class="p" onclick="saveCfg()">Save</button></p></div>
  <div class="card"><div class="stats" style="margin:0"><div><b>${money(added)}</b><span>Added by players</span></div><div><b>${money(fees)}</b><span>Entry fees collected</span></div></div></div>
  <div class="card"><h2>Add-money requests (${pend.length})</h2><p class="mu" style="margin:0 0 6px">Approve only after you see the money in your account.</p>`+(pend.length?"":'<p class="mu">No pending requests.</p>');
  pend.forEach(x=>{h+=`<div class="pl"><div><b>${money(x.amount)}</b> <span class="mu">${esc(x.name||"Player")}${x.utr?" · UTR "+esc(x.utr):""}<br>${new Date(x.at).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}</span></div><div><button class="ok" onclick="review('${x.id}',true)">Approve</button> <button class="no" onclick="review('${x.id}',false)">Reject</button></div></div>`});
  const all=txns(null).slice(0,40);
  return h+`</div><h2>All transactions</h2><div class="txl">`+(all.length?all.map(x=>txRow(x,true)).join(""):'<p class="mu" style="margin:0">None yet.</p>')+`</div>`}
function detail(){const t=S.t.find(x=>x.id===curT);if(!t){curT=null;return home()}
  const js=S.join.filter(j=>j.tid===t.id),fee=feeOf(t),full=js.length>=(+t.slots||1e9);
  let h=`<p><button onclick="curT=null;render(true)">← Back</button></p><div class="card"><div class="top" style="margin:0 0 4px"><h2 style="margin:0">${esc(t.title)}</h2>${BD[st(t)]}</div><div class="mu">${when(t)} · ${esc(t.map)} · ${esc(t.mode)} · Entry: ${feeTxt(t)} · Prize: ${esc(t.prize||"-")}</div>${slotBar(js.length,t)}</div>`;
  if(t.when&&!S.res[t.id])h+=`<div class="card cd"><div class="mu">Match starts in (hours : min : sec)</div><div id="cd" data-w="${esc(t.when)}">--:--:--</div></div>`;
  const c=S.creds[t.id]||{},res=S.res[t.id];
  if(adm()){
    h+=`<div class="card"><h2>Room ID &amp; password</h2><div class="row"><div><label>Room ID</label><input id="c_id" value="${esc(c.roomId)}"></div><div><label>Password</label><input id="c_pw" value="${esc(c.password)}"></div></div><p><button class="p" onclick="saveCreds()">Save</button></p><p class="mu" style="margin:0">Players who join see this right away.</p></div>`;
    h+=`<div class="card"><h2>Players joined (${js.length}/${esc(t.slots)})</h2>`+(js.length?"":'<p class="mu">No players yet.</p>');
    js.forEach(j=>{h+=`<div class="pl"><div><b>${esc(j.ign)}</b> <span class="mu">ID: ${esc(j.bgmiId)}${j.team?" · "+esc(j.team):""}${+j.fee?" · paid "+money(j.fee):""}</span></div><button class="no" onclick="removeP('${j.id}')">Remove${+j.fee?" &amp; refund":""}</button></div>`});
    h+=`</div><div class="card"><h2>Results</h2><label>One line per team/player: name, kills, points</label><textarea id="r_txt" placeholder="Team Alpha, 12, 28&#10;Team Bravo, 8, 21">${esc(res?.text)}</textarea><p><button class="p" onclick="saveRes()">Publish results</button></p></div><p><button class="no" onclick="delT()">Delete tournament</button></p>`;
  }else{
    const me=S.prof[uid]||{};
    if(joined(t.id))h+=`<div class="card"><h2>You are registered ✓</h2>`+(c.roomId?`<div class="mu">Tap to copy</div><button class="chip" data-c="${esc(c.roomId)}" onclick="cp(this)"><span class="mu">Room ID</span><b>${esc(c.roomId)}</b><span>📋</span></button><button class="chip" data-c="${esc(c.password)}" onclick="cp(this)"><span class="mu">Password</span><b>${esc(c.password)}</b><span>📋</span></button>`:'<p class="mu" style="margin:0">Room details will be posted here soon.</p>')+`</div>`;
    else if(full)h+=`<div class="card"><h2>Slots full</h2><p class="mu" style="margin:0">All slots are taken.</p></div>`;
    else{const b=bal(uid);h+=`<div class="card"><h2>Join tournament</h2><label>In-game name</label><input id="j_ign" value="${esc(me.ign)}"><label>BGMI character ID</label><input id="j_id" inputmode="numeric" value="${esc(me.bgmiId)}"><label>Team name (optional)</label><input id="j_team" value="${esc(me.team)}"><p class="mu">Entry: ${feeTxt(t)} · Wallet: ${money(b)}</p>`+(b<fee?`<p style="margin:0"><button class="p" onclick="addOpen=true;go('wallet')">Add money to join</button></p>`:`<p style="margin:0"><button class="p" onclick="join()">Join${fee?" · pay "+money(fee):" (free)"}</button></p>`)+`</div>`}
  }
  if(res&&res.text)h+=`<div class="card"><h2>Results</h2>${resTable(res.text)}</div>`;
  return h}
function render(f){if(!db)return;const a=document.activeElement,sc=$("#scr");
  if(!f&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&sc.contains(a)){pending=true;return}
  const top=sc.scrollTop;let h;try{h=curT?detail():({home,matches,board:boardV,wallet:walletV,profile:profV,settings:settingsV}[tab]||home)()}catch(e){console.error(e);h='<p class="mu">Something went wrong. Reload the page.</p>'}
  const an=ANIM&&motionOK();ANIM=false;sc.classList.toggle("anim",an);sc.innerHTML=h;sc.scrollTop=top;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===(tab==="settings"?"profile":tab)));navInd();post(an);tick()}
document.addEventListener("focusout",()=>{if(pending){pending=false;setTimeout(()=>render(),80)}});
/* actions */
const err=e=>alert("Error: "+(e.message||e.code||e));
async function createT(){const title=v("n_title");if(!title)return alert("Enter a title");
  try{await db.doc("tournaments/t"+Date.now().toString(36)).set({title,when:v("n_when"),map:v("n_map"),mode:v("n_mode"),slots:v("n_slots"),fee:v("n_fee"),prize:v("n_prize"),created:Date.now()});showForm=false;render(true);alert("Tournament created ✓")}catch(e){err(e)}}
async function saveCreds(){try{await db.doc("creds/"+curT).set({roomId:v("c_id"),password:v("c_pw")});alert("Room ID & password saved ✓")}catch(e){err(e)}}
async function saveRes(){try{await db.doc("results/"+curT).set({text:$("#r_txt").value});alert("Results published ✓")}catch(e){err(e)}}
async function saveProf(){const ign=v("p_ign");if(!ign)return alert("Enter your in-game name");
  try{await db.doc("profiles/"+uid).set({ign,bgmiId:v("p_id"),team:v("p_team"),photo:okPh(tmpPhoto)?tmpPhoto:""});editP=false;tmpPhoto=undefined;render(true);alert("Profile saved ✓")}catch(e){err(e)}}
async function join(){const t=S.t.find(x=>x.id===curT),fee=feeOf(t),ign=v("j_ign"),bgmiId=v("j_id");if(!ign||!bgmiId)return alert("Enter your name and BGMI ID");
  if(S.join.filter(j=>j.tid===t.id).length>=(+t.slots||1e9))return alert("Slots are full");
  const b=bal(uid);if(b<fee)return alert("Not enough balance. Add money first.");
  if(join.busy)return;
  if(fee){const ok=await dlg({icon:"💰",title:"Confirm payment",msg:`Pay <b>${money(fee)}</b> to join <b>${esc(t.title)}</b>?<br>${money(fee)} will be deducted from your wallet.<br><br>Balance after: <b>${money(b-fee)}</b>`,ok:"Confirm & Pay",cancel:"Cancel"});if(!ok)return}
  join.busy=true;
  try{await db.doc("joins/"+jid(t.id,uid)).set({tid:t.id,uid,ign,bgmiId,team:v("j_team"),fee,at:Date.now()});
    if(!S.prof[uid])await db.doc("profiles/"+uid).set({ign,bgmiId,team:v("j_team")});
    await dlg({icon:"🎉",title:"You are in!",msg:fee?`${money(fee)} was paid from your wallet.<br>Balance: <b>${money(b-fee)}</b>`:"You have joined this tournament."})}catch(e){err(e)}finally{join.busy=false}}
async function removeP(id){try{await db.doc("joins/"+id).delete();alert("Player removed, fee refunded")}catch(e){err(e)}}
async function delT(){const ok=await dlg({icon:"🗑️",title:"Delete tournament?",msg:"All joined players will be refunded.",ok:"Delete",cancel:"Cancel"});if(!ok)return;
  try{for(const j of S.join.filter(j=>j.tid===curT))await db.doc("joins/"+j.id).delete();
    await db.doc("tournaments/"+curT).delete();await db.doc("creds/"+curT).delete();await db.doc("results/"+curT).delete();curT=null;render(true)}catch(e){err(e)}}
/* wallet actions */
function nextAdd(){const a=Math.floor(+v("w_amt"));if(!(a>=10))return alert("Minimum amount is ₹10");if(a>50000)return alert("Maximum is ₹50,000 at a time");
  const cf=S.cfg.payment;if(!cf||!cf.upi)return alert("The host has not set up payments yet");showQR(a,cf)}
let curQR=null;
function showQR(a,cf){curQR={a,upi:cf.upi};let m=$("#modal");if(!m){m=document.createElement("div");m.id="modal";$("#phone").appendChild(m)}
  const link="upi://pay?pa="+encodeURIComponent(cf.upi)+"&pn="+encodeURIComponent(cf.name||"YAPPER")+"&am="+a.toFixed(2)+"&cu=INR&tn="+encodeURIComponent("YAPPER wallet");
  m.innerHTML=`<div class="mc"><h2 style="text-align:center">Pay ${money(a)}</h2><div id="qr"></div><div class="mu" style="text-align:center">Scan with any UPI app and pay exactly ${money(a)}</div><p style="margin:8px 0 0;text-align:center"><button id="dlb" onclick="dlQR()">⬇ Download QR</button></p><div class="mu" style="text-align:center;margin-top:6px">On this phone? Download it, then scan it from your gallery in your UPI app.</div><button class="chip" data-c="${esc(cf.upi)}" onclick="cp(this)"><span class="mu">UPI ID</span><b style="font-size:15px">${esc(cf.upi)}</b><span>📋</span></button><label>UTR / transaction ID (optional, helps the host match your payment)</label><input id="w_utr" placeholder="12-digit UTR"><p style="margin:12px 0 0"><button class="p" id="paidb" style="width:100%" onclick="paid(${a})">I have paid</button></p><p style="margin:8px 0 0;text-align:center"><button onclick="closeModal()">Cancel</button></p></div>`;
  const q=$("#qr");try{new QRCode(q,{text:link,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.textContent="Could not draw the QR. Pay to the UPI ID below."}claude.use("downloads").then(d=>{if(!d)$("#dlb")?.remove()})}
async function dlQR(){if(!curQR)return;const src=$("#qr canvas")||$("#qr img");if(!src)return alert("QR is not ready yet");
  const{a,upi}=curQR,W=640,H=820,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.textAlign="center";x.fillStyle="#0c2b2b";
  x.font="bold 40px sans-serif";x.fillText("YAPPER",W/2,70);x.font="bold 54px sans-serif";x.fillText("Pay ₹"+a,W/2,150);
  x.imageSmoothingEnabled=false;x.drawImage(src,70,180,500,500);
  x.font="26px sans-serif";x.fillStyle="#333";x.fillText("UPI ID: "+upi,W/2,735);
  x.font="22px sans-serif";x.fillStyle="#666";x.fillText("Scan in any UPI app. The amount is filled in.",W/2,775);
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const d=await claude.use("downloads");if(!d)return alert("Download is not available here");
  try{await d.save({filename:"YAPPER-pay-"+a+".png",data:blob})}catch(e){if(e.code!=="declined")alert("Could not save: "+(e.message||e.code))}}
const closeModal=()=>{$("#modal")?.remove()};
async function paid(a){if(paid.busy)return;paid.busy=true;const b=$("#paidb");if(b){b.disabled=true;b.textContent="Sending…"}
  const me=S.prof[uid];
  try{await db.doc("topups/"+Date.now().toString(36)+"_"+uid).set({uid,name:me?.ign||"Player",amount:a,utr:v("w_utr"),at:Date.now()});closeModal();addOpen=false;render(true);
    await dlg({icon:"✅",title:"Request sent",msg:`Your <b>${money(a)}</b> add-money request was sent to the host. Your balance updates once they approve it.`})}
  catch(e){err(e);if(b){b.disabled=false;b.textContent="I have paid"}}finally{paid.busy=false}}
async function review(id,ok){const x=S.top.find(z=>z.id===id);try{await db.doc("reviews/"+id).set({uid:x.uid,amount:x.amount,status:ok?"approved":"rejected",at:Date.now()});alert(ok?"Added to player wallet ✓":"Request rejected")}catch(e){err(e)}}
async function saveCfg(){const upi=v("u_id");if(!/^[\w.\-]{2,}@[\w.\-]{2,}$/.test(upi))return alert("Enter a valid UPI ID like name@bank");try{await db.doc("config/payment").set({upi,name:v("u_nm")});alert("Payment details saved ✓")}catch(e){err(e)}}

  for(let i=0;i<16;i++){const e=document.createElement("i"),z=2+Math.random()*4;
    e.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;--s:${z.toFixed(1)}px;--x:${Math.round((Math.random()-.5)*60)}px;--d:${(9+Math.random()*9).toFixed(1)}s;--dl:-${(Math.random()*12).toFixed(1)}s`;a.appendChild(e)}
